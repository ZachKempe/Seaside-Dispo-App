[build]
  publish = "public"
  functions = "netlify/functions"

# Pretty short-link for Deal Deck PDFs: /deck/<slug> -> deck function -> Storage PDF
[[redirects]]
  from = "/deck/*"
  to = "/.netlify/functions/deck?slug=:splat"
  status = 200

# C2 — the tokenized buy-box form linked from the interest receipt. A short,
# branded path because it goes out in email and gets read by humans; the
# query string (?t=<token>) passes through a 200 rewrite untouched.
[[redirects]]
  from = "/buy-box"
  to = "/.netlify/functions/buy-box"
  status = 200

[functions."sync-buyers"]
  schedule = "*/5 * * * *"

[functions."capture-replies"]
  schedule = "*/15 * * * *"

# F9 — weekly digest email to NOTIFY_EMAIL (Mondays 14:00 UTC ≈ 9am ET / 8am CT).
[functions."weekly-digest"]
  schedule = "0 14 * * 1"

# Rent estimates — every single-family deal gets a short-term (AirDNA) and a
# long-term (RentCast) estimate, new deals within 15 min even if the
# dashboard's post-upload call never ran, re-pulled every 30 days so both are
# tracked. See lib/rent-estimate.js.
[functions."rent-estimates-sync"]
  schedule = "*/15 * * * *"
