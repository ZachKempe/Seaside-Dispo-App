<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Posting Dashboard — Seaside Horizon</title>
  <link rel="icon" type="image/png" href="/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="topbar">
    <div class="brand"><img src="/img/logo.png" alt="Seaside Horizon" class="brand-logo"> Seaside Horizon</div>
    <nav>
      <a href="/dashboard.html" class="active">Posting</a>
      <a href="/pipeline.html">Pipeline</a>
      <a href="/buyers.html">Buyers</a>
      <a href="/reports.html">Reports</a>
      <button class="logout" id="logout-btn">Sign Out</button>
    </nav>
  </div>

  <div class="page">
    <div class="page-header">
      <div>
        <h1>Posting Dashboard</h1>
        <div class="sub" id="prop-count"></div>
        <div class="sub" id="sync-health" style="font-size:0.78rem;margin-top:2px"></div>
      </div>
      <button class="btn btn-ghost btn-sm" id="refresh-btn">↻ Refresh</button>
    </div>

    <div id="content">
      <div class="loading"><div class="spinner"></div>Loading properties…</div>
    </div>
  </div>

  <!-- ── Blast recipient picker modal ── -->
  <div id="blast-modal-backdrop" class="hidden modal-backdrop">
    <div class="card" style="width:100%;max-width:560px;max-height:85vh;overflow-y:auto">
      <h2 id="blast-modal-title" style="margin-top:0">Send Blast</h2>
      <p class="muted" id="blast-modal-sub" style="margin-top:-8px;font-size:0.86rem"></p>

      <div class="field">
        <label style="display:flex;align-items:center;gap:8px;font-weight:500;color:var(--text-1)">
          <input type="radio" name="blast-recipients-mode" id="blast-mode-all" value="all" checked style="width:auto">
          All matching buyers <span id="blast-all-count" class="muted"></span>
        </label>
        <label style="display:flex;align-items:center;gap:8px;font-weight:500;color:var(--text-1);margin-top:8px">
          <input type="radio" name="blast-recipients-mode" id="blast-mode-select" value="select" style="width:auto">
          Choose specific buyers
        </label>
      </div>

      <div class="field" style="margin-top:4px">
        <label style="font-weight:500;color:var(--text-1);font-size:0.86rem">Channels</label>
        <div style="display:flex;gap:18px;margin-top:4px">
          <label style="display:flex;align-items:center;gap:6px;font-weight:400;color:var(--text-1)"><input type="checkbox" id="blast-ch-email" checked style="width:auto"> 📧 Email</label>
          <label style="display:flex;align-items:center;gap:6px;font-weight:400;color:var(--text-1)"><input type="checkbox" id="blast-ch-sms" checked style="width:auto"> 💬 SMS <span class="muted" style="font-size:0.72rem">(opted-in buyers only)</span></label>
        </div>
      </div>

      <div class="field" id="blast-variation-field" style="margin-top:4px">
        <label style="font-weight:500;color:var(--text-1);font-size:0.86rem">Marketing copy variation <span class="muted" style="font-weight:400">(tracked for response-rate analytics)</span></label>
        <select id="blast-variation-select" style="margin-top:4px;width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border);font-size:0.86rem"></select>
        <p class="muted" id="blast-variation-preview" style="font-size:0.76rem;margin-top:6px;max-height:70px;overflow-y:auto;white-space:pre-wrap"></p>
      </div>

      <div id="blast-buyer-list" class="hidden" style="border:1px solid var(--border);border-radius:10px;padding:10px;max-height:320px;overflow-y:auto;margin-top:6px">
        <div id="blast-method-filter" class="flex gap-8" style="flex-wrap:wrap;margin-bottom:8px"></div>
        <div class="flex gap-8" style="margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--border);align-items:center">
          <button type="button" class="btn btn-ghost btn-sm" id="blast-select-all">Select all shown</button>
          <button type="button" class="btn btn-ghost btn-sm" id="blast-select-none">Deselect all shown</button>
          <span class="muted" id="blast-selected-count" style="font-size:0.76rem;margin-left:auto"></span>
        </div>
        <div id="blast-buyer-checkboxes"></div>
      </div>

      <div class="field" style="margin-top:4px">
        <label style="font-weight:500;color:var(--text-1);font-size:0.86rem">Test email address <span class="muted" style="font-weight:400">(for "Send Test" only — defaults to your login email)</span></label>
        <input type="email" id="blast-test-email" placeholder="you@example.com" style="margin-top:4px;width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border);font-size:0.86rem">
      </div>

      <div class="field" style="margin-top:4px">
        <label style="font-weight:500;color:var(--text-1);font-size:0.86rem">Test phone number <span class="muted" style="font-weight:400">(for "Send Test" SMS — defaults to your marketing number)</span></label>
        <input type="tel" id="blast-test-phone" placeholder="+15551234567" style="margin-top:4px;width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border);font-size:0.86rem">
      </div>

      <div class="flex gap-8 mt-16" style="justify-content:flex-end">
        <button type="button" class="btn btn-ghost" id="blast-modal-cancel">Cancel</button>
        <button type="button" class="btn btn-ghost" id="blast-modal-test">🧪 Send Test (to me only)</button>
        <button type="button" class="btn btn-primary" id="blast-modal-send">📣 Send Live Blast</button>
      </div>
    </div>
  </div>

  <!-- ── Pipeline lead add/edit modal ── -->
  <div id="lead-modal-backdrop" class="hidden modal-backdrop">
    <div class="card" style="width:100%;max-width:440px;max-height:85vh;overflow-y:auto">
      <h2 id="lead-modal-title" style="margin-top:0">Add Lead</h2>
      <p class="muted" id="lead-modal-sub" style="margin-top:-8px;font-size:0.86rem"></p>

      <div class="field">
        <label>Name</label>
        <input type="text" id="lead-name" placeholder="Buyer or contact name">
      </div>
      <div class="field">
        <label>Contact (email / phone)</label>
        <input type="text" id="lead-contact" placeholder="name@email.com or (555) 555-5555">
      </div>
      <div class="flex gap-8">
        <div class="field" style="flex:1">
          <label>Source</label>
          <select id="lead-source">
            <option value="buyer_blast">Buyer list / blast</option>
            <option value="investorlift">InvestorLift</option>
            <option value="creativelisting">CreativeListing</option>
            <option value="fb_group">Facebook group</option>
            <option value="referral">Referral</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="field" style="flex:1">
          <label>Channel</label>
          <select id="lead-channel">
            <option value="">—</option>
            <option value="email">Email</option>
            <option value="sms">SMS / Text</option>
            <option value="dm">DM / Message</option>
            <option value="call">Phone call</option>
            <option value="in_person">In person</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Stage</label>
        <select id="lead-stage">
          <option value="new">New</option>
          <option value="responded">Responded</option>
          <option value="interested">Interested</option>
          <option value="offer">Offer made</option>
          <option value="under_contract">Under contract</option>
          <option value="closed">Closed 🎉</option>
          <option value="dead">Dead / passed</option>
        </select>
      </div>
      <div class="field">
        <label>Notes</label>
        <textarea id="lead-notes" rows="3" placeholder="What did they say? Offer terms? Next steps?"></textarea>
      </div>

      <div class="flex-between mt-16">
        <button type="button" class="btn btn-ghost" id="lead-modal-delete" style="color:var(--red);display:none">Remove from pipeline</button>
        <div class="flex gap-8" style="margin-left:auto">
          <button type="button" class="btn btn-ghost" id="lead-modal-cancel">Cancel</button>
          <button type="button" class="btn btn-primary" id="lead-modal-save">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/supa.js"></script>
  <script src="/js/deal-shared.js"></script>
  <script src="/js/ui-shared.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
