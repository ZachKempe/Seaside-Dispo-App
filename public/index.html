<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seaside Dispo — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <h1>🏡 Seaside Dispo</h1>
      <p class="sub">Sign in to manage properties &amp; buyers</p>
      <form id="login-form">
        <div class="field">
          <label>Email</label>
          <input type="email" id="email" autocomplete="username" required>
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" id="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary" id="submit-btn">Sign In</button>
        <div class="err" id="err"></div>
        <div id="msg" style="color:#2F855A;font-size:0.85rem;margin-top:8px"></div>
        <a href="#" id="forgot-link" style="display:inline-block;margin-top:12px;font-size:0.82rem;color:var(--navy,#1B3A6B)">Forgot password?</a>
      </form>
    </div>
  </div>

  <script src="/js/supa.js"></script>
  <script>
    (async () => {
      const { data: { session } } = await supa.auth.getSession();
      if (session) window.location.href = "/dashboard.html";
    })();

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("submit-btn");
      const err = document.getElementById("err");
      err.textContent = "";
      btn.disabled = true;
      btn.textContent = "Signing in…";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const { error } = await supa.auth.signInWithPassword({ email, password });

      if (error) {
        err.textContent = "Incorrect email or password.";
        btn.disabled = false;
        btn.textContent = "Sign In";
        return;
      }
      window.location.href = "/dashboard.html";
    });

    // Forgot password: Supabase emails a recovery link that lands on /reset.html.
    document.getElementById("forgot-link").addEventListener("click", async (e) => {
      e.preventDefault();
      const err = document.getElementById("err");
      const msg = document.getElementById("msg");
      err.textContent = ""; msg.textContent = "";
      const email = document.getElementById("email").value.trim();
      if (!email) { err.textContent = "Type your email above first, then click reset."; return; }
      const { error } = await supa.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + "/reset.html",
      });
      if (error) { err.textContent = "Couldn't send the reset email: " + error.message; return; }
      msg.textContent = "Reset link sent — check your email (including spam).";
    });
  </script>
</body>
</html>
