<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pipeline — Seaside Horizon</title>
  <link rel="icon" type="image/png" href="/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* ── Pipeline board (Trello-style) ── */
    .pl-board {
      display: flex; gap: 14px; align-items: flex-start;
      overflow-x: auto; padding: 4px 4px 20px;
      min-height: 60vh;
    }
    .pl-col {
      flex: 0 0 288px; width: 288px;
      background: #EDF1F6; border-radius: 12px;
      display: flex; flex-direction: column; max-height: calc(100vh - 200px);
    }
    .pl-col-head {
      display: flex; align-items: center; gap: 8px;
      padding: 12px 14px 10px; font-weight: 700; color: var(--navy-dark);
      border-top: 4px solid var(--pl-color, #A0AEC0); border-radius: 12px 12px 0 0;
      position: sticky; top: 0; background: #EDF1F6; z-index: 1;
    }
    .pl-col-head .pl-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--pl-color, #A0AEC0); }
    .pl-col-head .pl-count { margin-left: auto; color: var(--text-3); font-weight: 600; font-size: 0.85rem; }
    .pl-col-body { padding: 4px 10px 12px; overflow-y: auto; flex: 1; min-height: 60px; }
    .pl-col-body.drag-over { background: #DCE5F0; border-radius: 0 0 12px 12px; outline: 2px dashed var(--navy-light); outline-offset: -6px; }
    .pl-empty { color: var(--text-3); font-size: 0.8rem; text-align: center; padding: 14px 6px; }

    .pl-card {
      background: #fff; border: 1px solid var(--border); border-radius: 9px;
      padding: 10px 12px; margin-bottom: 8px; cursor: pointer;
      box-shadow: 0 1px 2px rgba(16,24,40,.06); transition: box-shadow .12s, transform .12s;
      border-left: 4px solid var(--pl-color, #A0AEC0);
    }
    .pl-card:hover { box-shadow: 0 4px 12px rgba(16,24,40,.12); transform: translateY(-1px); }
    .pl-card.dragging { opacity: .45; }
    .pl-card-title { font-weight: 700; color: var(--navy-dark); font-size: 0.9rem; line-height: 1.3; }
    .pl-card-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 7px; }
    .pl-tag { font-size: 0.68rem; font-weight: 700; border-radius: 999px; padding: 2px 8px; }
    .pl-tag-subto { background: #DBEAFE; color: var(--navy); }
    .pl-tag-morby { background: #FEEBC8; color: #9C4221; }
    .pl-mini { font-size: 0.7rem; color: var(--text-3); font-weight: 600; }
    .pl-last-update { margin-top: 7px; font-size: 0.7rem; color: var(--text-2); font-weight: 600; }

    /* Detail modal */
    .pl-note { padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 0.86rem; }
    .pl-note:last-child { border-bottom: none; }
    .pl-note-meta { font-size: 0.72rem; color: var(--text-3); margin-top: 3px; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand"><img src="/img/logo.png" alt="Seaside Horizon" class="brand-logo"> Seaside Horizon</div>
    <nav>
      <a href="/dashboard.html">Posting</a>
      <a href="/pipeline.html" class="active">Pipeline</a>
      <a href="/buyers.html">Buyers</a>
      <a href="/reports.html">Reports</a>
      <button class="logout" id="logout-btn">Sign Out</button>
    </nav>
  </div>

  <div class="page">
    <div class="page-header">
      <div>
        <h1>Pipeline</h1>
        <div class="sub"><span id="deal-count"></span><span id="stale-count" style="color:#C53030;font-weight:700"></span><span id="task-count" style="color:#B7791F;font-weight:700"></span></div>
      </div>
      <div class="flex gap-8">
        <button class="btn btn-ghost btn-sm" id="stages-btn">⚙ Manage stages</button>
        <button class="btn btn-ghost btn-sm" id="refresh-btn">↻ Refresh</button>
      </div>
    </div>

    <div id="board" class="pl-board"><div class="spinner" style="margin:40px auto"></div></div>
  </div>

  <!-- Deal detail modal -->
  <div id="detail-backdrop" class="hidden modal-backdrop modal-backdrop-padded">
    <div class="card" style="width:100%;max-width:520px;max-height:88vh;overflow-y:auto" id="detail-card"></div>
  </div>

  <!-- Manage stages modal -->
  <div id="stages-backdrop" class="hidden modal-backdrop modal-backdrop-padded">
    <div class="card" style="width:100%;max-width:560px;max-height:88vh;overflow-y:auto" id="stages-card"></div>
  </div>

  <script src="/js/supa.js"></script>
  <script src="/js/dispo.js"></script>
  <script src="/js/ui-shared.js"></script>
  <script src="/js/pipeline.js"></script>
</body>
</html>
